name: Deploy PoopTracker

on:
  push:
    branches:
      - claude/cross-platform-mobile-app-yq4CQ

jobs:
  deploy:
    name: Deploy to Expo
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create or link EAS project
        run: eas init --force --non-interactive

      - name: Publish OTA update
        run: eas update --branch main --message "v${{ github.run_number }}" --non-interactive
